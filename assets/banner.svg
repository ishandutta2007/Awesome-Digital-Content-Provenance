<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badge-c2pa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="badge-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="badge-trust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#334155" opacity="0.4" />
    </pattern>

    <style>
      .glow-orb-1 {
        animation: floatOrb 9s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 12s ease-in-out infinite alternate;
      }
      .pulse-ring {
        animation: pulseRing 3.5s ease-out infinite;
        transform-origin: 1040px 180px;
      }
      .signal-line {
        stroke-dasharray: 8 12;
        animation: dashFlow 25s linear infinite;
      }
      .pill-float-1 {
        animation: pillHover1 5s ease-in-out infinite alternate;
      }
      .pill-float-2 {
        animation: pillHover2 6s ease-in-out infinite alternate;
      }
      .pill-float-3 {
        animation: pillHover3 5.5s ease-in-out infinite alternate;
      }

      @keyframes floatOrb {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
        100% { transform: translate(60px, 35px) scale(1.15); opacity: 0.55; }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
        100% { transform: translate(-50px, -30px) scale(1.2); opacity: 0.5; }
      }
      @keyframes pulseRing {
        0% { r: 50; opacity: 0.8; stroke-width: 2.5; }
        50% { opacity: 0.4; stroke-width: 1.5; }
        100% { r: 90; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pillHover1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
      @keyframes pillHover2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-9px); }
      }
      @keyframes pillHover3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="glow-orb-1" cx="220" cy="120" r="160" fill="#38bdf8" filter="blur(80px)" />
  <circle class="glow-orb-2" cx="1020" cy="240" r="180" fill="#818cf8" filter="blur(90px)" />
  <circle cx="650" cy="320" r="130" fill="#a855f7" filter="blur(85px)" opacity="0.3" />

  <!-- Dynamic Circuit / Provenance Trace Lines -->
  <g opacity="0.45" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path class="signal-line" d="M 50 180 H 300 L 360 240 H 840 L 900 180 H 1150" />
    <path class="signal-line" d="M 80 290 H 260 L 310 330 H 780 L 830 290 H 1120" stroke="#818cf8" stroke-dashoffset="50" />
    <path class="signal-line" d="M 200 60 H 420 L 470 100 H 720 L 770 60 H 1050" stroke="#c084fc" stroke-dashoffset="120" />
  </g>

  <!-- Cryptographic Provenance Seal Graphic (Right Side) -->
  <g transform="translate(0, 0)">
    <circle class="pulse-ring" cx="1040" cy="180" r="60" fill="none" stroke="#38bdf8" />
    <circle cx="1040" cy="180" r="54" fill="#0f172a" stroke="url(#primary-glow)" stroke-width="3" />
    
    <!-- Shield / Provenance Check Icon inside Seal -->
    <path d="M 1040 148 L 1064 158 V 182 C 1064 198 1054 212 1040 218 C 1026 212 1016 198 1016 182 V 158 Z" 
          fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 1031 183 L 1037 189 L 1050 174" 
          fill="none" stroke="#34d399" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Orbiting Manifest Node Indicators -->
    <circle cx="985" cy="135" r="4.5" fill="#38bdf8" opacity="0.9" />
    <circle cx="1095" cy="135" r="4.5" fill="#818cf8" opacity="0.9" />
    <circle cx="1095" cy="225" r="4.5" fill="#c084fc" opacity="0.9" />
    <circle cx="985" cy="225" r="4.5" fill="#34d399" opacity="0.9" />
    <line x1="985" y1="135" x2="1040" y2="180" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="1095" y1="135" x2="1040" y2="180" stroke="#818cf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="1095" y1="225" x2="1040" y2="180" stroke="#c084fc" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="985" y1="225" x2="1040" y2="180" stroke="#34d399" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
  </g>

  <!-- Left Accent Vertical Pillar -->
  <rect x="75" y="80" width="5" height="235" rx="2.5" fill="url(#primary-glow)" />

  <!-- Main Titles (Foreground, High-Contrast & Guaranteed Non-Overlapping) -->
  <g transform="translate(100, 0)">
    <!-- Sub-heading Tag -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#38bdf8" text-transform="uppercase">
      CURATED AWESOME ARCHIVE
    </text>

    <!-- Main Title -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.8">
      Digital Content Provenance
    </text>

    <!-- Gradient Subtitle -->
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="url(#primary-glow)">
      C2PA Standard · Deepfake Detection · Content Credentials · Watermarking
    </text>

    <!-- Description -->
    <text x="0" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
      The authoritative index of enterprise SaaS solutions, APIs &amp; open-source developer tooling.
    </text>
  </g>

  <!-- Interactive Floating Tags / Pills (Guaranteed Below Text & Separated) -->
  <g transform="translate(100, 275)">
    <!-- Pill 1: C2PA Standard -->
    <g class="pill-float-1" transform="translate(0, 0)">
      <rect width="155" height="34" rx="17" fill="url(#badge-c2pa)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4.5" fill="#38bdf8" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e0f2fe">C2PA Standard</text>
    </g>

    <!-- Pill 2: Deepfake Defense -->
    <g class="pill-float-2" transform="translate(170, 0)">
      <rect width="175" height="34" rx="17" fill="url(#badge-ai)" stroke="#c084fc" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4.5" fill="#c084fc" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#fae8ff">Deepfake Defense</text>
    </g>

    <!-- Pill 3: Trust & Verification -->
    <g class="pill-float-3" transform="translate(360, 0)">
      <rect width="185" height="34" rx="17" fill="url(#badge-trust)" stroke="#34d399" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4.5" fill="#34d399" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#d1fae5">Cryptographic Proof</text>
    </g>
  </g>
</svg>
